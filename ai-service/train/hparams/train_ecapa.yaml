# ──────────────────────────────────────────────────────────────────
# train_ecapa.yaml  —  Hyperparameters for ECAPA-TDNN fine-tuning
# Usage: python train/finetune_ecapa.py train/hparams/train_ecapa.yaml --prepare
# ──────────────────────────────────────────────────────────────────

seed: 42

# ── Paths ──────────────────────────────────────────────────────────
data_folder: data/voxvietnam       # root produced by prepare_voxvietnam.py
train_csv:   data/train.csv        # generated by finetune_ecapa.py Step 1
val_csv:     data/val.csv
test_csv:    data/test.csv
output_folder: results/ECAPA       # checkpoints + logs saved here
pretrained_path: pretrained_models/spkrec-ecapa-voxceleb
pretrained_source: speechbrain/spkrec-ecapa-voxceleb

# ── Training schedule ──────────────────────────────────────────────
n_epochs: 20
batch_size: 32
freeze_until_epoch: 5              # freeze backbone for first 5 epochs

# ── Optimizer ─────────────────────────────────────────────────────
lr: 0.0001
lr_final: 0.000001                 # cosine annealing end LR

# ── AAM-Softmax ────────────────────────────────────────────────────
# Additive Angular Margin Softmax — best loss for speaker verification
margin: 0.2
scale:  30

# ── Audio settings ────────────────────────────────────────────────
sample_rate: 16000
sentence_len: 3.0                  # seconds per training chunk (random crop)
shuffle: True

num_workers: 4

# ── Model architecture ────────────────────────────────────────────
# Using SpeechBrain's built-in ECAPA-TDNN
# Channels: [1024, 1024, 1024, 1024, 3072]  (standard ECAPA-TDNN-1024)
embedding_dim: 192

# ── Checkpointing ─────────────────────────────────────────────────
# Best checkpoint = lowest speaker-disjoint verification loss.
# Saved to: <output_folder>/best_model.ckpt
