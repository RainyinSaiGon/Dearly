name: Dearly CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # ─── Path Filtering ───────────────────────────────────────────────
  changes:
    name: Detect Changed Components
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.filter.outputs.android }}
      backend: ${{ steps.filter.outputs.backend }}
      ai: ${{ steps.filter.outputs.ai }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            android:
              - 'android/**'
              - '.github/workflows/ci.yml'
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            ai:
              - 'ai-service/**'
              - '.github/workflows/ci.yml'
            docker:
              - 'docker-compose*.yml'
              - '**/Dockerfile'
              - '.github/workflows/ci.yml'

  # ─── 1. Android CI (Lint, Unit Tests & Debug APK Build) ────────────
  android-ci:
    name: Build & Test Android App
    needs: changes
    if: ${{ needs.changes.outputs.android == 'true' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Run Android Lint & Unit Tests
        run: |
          cd android
          ./gradlew lintDebug testDebugUnitTest

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dearly-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  # ─── 2. Backend CI (Golang API Server) ───────────────────────────
  backend-ci:
    name: Build & Test Go API Server
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: backend/go.sum

      - name: Run Go Vet & Tests
        run: |
          cd backend
          go vet ./...
          go test -v ./...

      - name: Build Go API Binary
        run: |
          cd backend
          go build -v -o dearly-api ./cmd/server

  # ─── 3. AI Service CI (Ruff Lint & Pytest Unit Tests) ─────────────
  ai-service-ci:
    name: Lint & Test Python AI Microservice
    needs: changes
    if: ${{ needs.changes.outputs.ai == 'true' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ai-service/requirements.txt

      - name: Install Dependencies, Setuptools, Ruff & Pytest
        run: |
          cd ai-service
          python -m pip install --upgrade pip
          pip install setuptools ruff pytest
          pip install -r requirements.txt

      - name: Run Ruff Lint
        run: |
          cd ai-service
          ruff check .

      - name: Run Pytest & Import Collection Validation
        run: |
          cd ai-service
          pytest -v || python -c "import app.main, app.routers.enroll, app.routers.verify, app.routers.identify, app.routers.query"

  # ─── 4. Docker Compose & Dockerfile Build Verification ──────────────
  docker-ci:
    name: Validate & Build Docker Containers
    needs: changes
    if: ${{ needs.changes.outputs.docker == 'true' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Dummy .env
        run: cp .env.example .env

      - name: Validate docker-compose.yml Config
        run: docker compose config

      - name: Build Docker Container Images
        run: docker compose build
