services:
  postgres:
    image: postgres:16-alpine
    container_name: dearly-postgres
    restart: unless-stopped
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dearly-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.9.1
    container_name: dearly-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10

  go-api:
    build:
      context: ./backend
      args:
        SERVICE: server
    container_name: dearly-go-api
    restart: unless-stopped
    env_file: .env
    environment:
      MIGRATIONS_PATH: /app/migrations
      KAFKA_BROKERS: kafka:9092
    ports:
      - "8080:8080"
    volumes:
      - type: bind
        source: ./backend/firebase-sa.json
        target: /run/secrets/firebase-sa.json
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      ai-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  notification-worker:
    build:
      context: ./backend
      args:
        SERVICE: notification-worker
    container_name: dearly-notification-worker
    restart: unless-stopped
    env_file: .env
    environment:
      KAFKA_BROKERS: kafka:9092
    volumes:
      - type: bind
        source: ./backend/firebase-sa.json
        target: /run/secrets/firebase-sa.json
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      go-api:
        condition: service_healthy
      kafka:
        condition: service_healthy

  ai-service:
    build:
      context: ./ai-service
    container_name: dearly-ai-service
    restart: unless-stopped
    env_file: .env
    environment:
      WHISPER_MODEL_CACHE: /models/cache/whisper
      WHISPER_MODEL: ${WHISPER_MODEL:-medium}
      WHISPER_LANGUAGE: vi
      WHISPER_INITIAL_PROMPT: "Đây là yêu cầu tiếng Việt cho trợ lý chăm sóc sức khỏe Dearly: Mấy giờ rồi? Hôm nay uống thuốc gì? Gọi cho con tôi."
    expose:
      - "5000"
    volumes:
      - ./models:/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/ready"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
  redis_data:
  kafka_data:
